[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mo438-f1"
version = "0.1.0"
description = "Pipeline reprodutível para a entrega F1 do projeto MO438 usando ogbn-arxiv"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "python-igraph>=0.11",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ogb = ["ogb>=1.3.6"]  # optional: not needed, the raw OGB zip is parsed directly
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
mo438-f1 = "mo438_f1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
